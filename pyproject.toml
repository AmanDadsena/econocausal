[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econocausal"
version = "1.0.0"
description = "Dynamic pricing via Double Machine Learning"
authors = [{ name = "Aman Singh Dadsena" }]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# pycodestyle, pyflakes, warnings, import order, bugbear, comprehensions, pyupgrade.
select = ["E", "F", "W", "I", "B", "C4", "UP"]
# Long lines are allowed where splitting would hurt readability (docstrings, tables, SQL).
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["econocausal", "api"]
# Modules imported by plain name from their own folder: app/common.py and tests/test_dml.py.
known-local-folder = ["common", "test_dml"]
